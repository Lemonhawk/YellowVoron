
#####################################################################
#   Macros in this file
#####################################################################
#   G32    ; Superslicer only
#   PRINT_START     ;  orca and Superslicer
#   PRINT_END
#   UNLOAD_FILAMENT
#   HEATSOAK
#   CANCEL_HEATSOAK
#   CLEAN_NOZZLE
#   CLEAN_NOZZLE_GANTRY
#   
#
#   #  LED status 
#   STATUS_READY
#   STATUS_OFF
#   STATUS_BUSY
#   STATUS_HEATING
#   STATUS_LEVELING
#   STATUS_HOMING
#   STATUS_CLEANING
#   STATUS_MESHING
#   STATUS_CALIBRATING_Z
# 
#####################################################################
#  used with SuperSlicer (not used with Orca)
[gcode_macro _G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
   ;   G28       #  should not need this extra homing
    STATUS_CLEANING
    CLEAN_NOZZLE
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    G28
    STATUS_MESHING
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5 METHOD=automatic    ##  added 4/13/2024 cpe
    G0 X150 Y150 Z30 F3600
    
    #--------------------------------------------------------------------
    STATUS_READY
    RESTORE_GCODE_STATE NAME=STATE_G32

#####################################################################
#   print_start macro for Orca slicer with adaptive bed mesh (ver 2.0)
#####################################################################

## *** THINGS TO UNCOMMENT: ***
## Bed mesh (2 lines at 2 locations)
## Z_TILT_ADJUST if your printer is a Trident
## Quad gantry level if your printer is a V2
## Nevermore - if you have one

[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # Homes the printer, sets absolute positioning and updates the Stealthburner leds.
  STATUS_HOMING         # Sets SB-leds to homing-mode
  G28                   # Full home (XYZ)  12/28/2025 added XYZ for clarity (removed) -- cpe
  G90                   # Absolute position
  M106 S0               # Turns off partcooling fan

  ##  Uncomment for bed mesh (1 of 2)
  BED_MESH_CLEAR       # Clears old saved bed mesh (if any)

  # Checks if the bed temp is higher than 90c - if so then change a bed heater temperature.
  {% if params.BED|int > 100 %}                         # changed from 90 to 110  -- heatsoak should have already been run
    # SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    # M106 S255                                           # Turns on the PT-fan

    ##  Uncomment if you have a Nevermore.
    #SET_PIN PIN=nevermore VALUE=1                      # Turns on the nevermore

    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
    M140 S100                                           # Sets the bed temperature to TAPS 100c no wait
    # SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"  # Displays info
    # TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   # Waits for chamber to reach desired temp

  # If the bed temp is not over 110 (was 90)c, then it skips the heatsoak and just heats up to set temp with a 5min soak
  {% else %}
    # SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
    # M190 S{target_bed}                                  # Sets the target temp for the bed
    # SET_DISPLAY_TEXT MSG="Soak for 5min"                # Displays info
    # G4 P300000                                          # Waits 5 min for the bedtemp to stabilize
  {% endif %}

  # Heating nozzle to 150 degrees. This helps with getting a correct Z-home
  # SET_DISPLAY_TEXT MSG="Hotend: 150c"          # Displays info
  M109 S150                                    # Heats the nozzle to 150c  150 for TAP

  ##  Uncomment for Trident (Z_TILT_ADJUST)
  #SET_DISPLAY_TEXT MSG="Z-tilt adjust"     # Displays info
  #STATUS_LEVELING                          # Sets SB-leds to leveling-mode
  #Z_TILT_ADJUST                            # Levels the buildplate via z_tilt_adjust
  #G28 Z                                    # Homes Z again after z_tilt_adjust

  ##  Uncomment for V2 (Quad gantry level AKA QGL)
  # SET_DISPLAY_TEXT MSG="QGL"      # Displays info
  STATUS_LEVELING                 # Sets SB-leds to leveling-mode
  CLEAN_NOZZLE
  QUAD_GANTRY_LEVEL               # Levels the buildplate via QGL --- Macro in Printer config
  G28 Z                           # Homes Z again after QGL

  ##  Uncomment for bed mesh (2 of 2)
  # SET_DISPLAY_TEXT MSG="Bed mesh"    # Displays info
  STATUS_MESHING                     # Sets SB-leds to bed mesh-mode
  
  #BED_MESH_CALIBRATE                 # Starts bed mesh  Orca prior to 2.0  cpe
  
  RESPOND MSG="Adaptive Bed Mesh started -- macros.cfg"
  #
  #  Hopefully the missing link to get adaptive mesh working 5/11/2025 cpe   --- still no adaptive mesh
  #EXCLUDE_OBJECT_DEFINE
  
  ; Always pass `ADAPTIVE_MARGIN=0` because Orca has already handled `adaptive_bed_mesh_margin` internally
  ;;     #  try 4 on Klipper adaptive mesh  <-- always full bed mesh  
  ;;     Added PROFILE=adaptive  5/17/2025 trying to get adaptive mesh to work   -- cpe
  BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=automatic 
  ;BED_MESH_CALIBRATE ADAPTIVE=0 ADAPTIVE_MARGIN=0 METHOD=automatic    #  try 5 on Klipper adaptive mesh
  ; Always pass `ADAPTIVE_MARGIN=0` because Orca has already handled `adaptive_bed_mesh_margin` internally?????
  #BED_MESH_CALIBRATE 
  #  mesh_min={adaptive_bed_mesh_min[0]},{adaptive_bed_mesh_min[1]}
  #	 mesh_max={adaptive_bed_mesh_max[0]},{adaptive_bed_mesh_max[1]}
  #	 ALGORITHM=[bed_mesh_algo] PROBE_COUNT={bed_mesh_probe_count[0]},{bed_mesh_probe_count[1]}
  #	 ADAPTIVE=1 ADAPTIVE_MARGIN=0
  # Heats up the nozzle up to target via data from slicer
  # SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"           # Displays info
  #  Home again just before heating to print
  STATUS_HOMING         # Sets SB-leds to homing-mode
  G28                   # Full home (XYZ)
  #
  STATUS_HEATING                                                # Sets SB-leds to heating-mode
  G1 X{x_wait} Y{y_wait} Z15 F9000                              # Goes to center of the bed
  M140 S{target_bed}                                            # Set the bed temperature without a wait while waiting for extruder to get to temperature
  M109 S{target_extruder}                                       # Heats the nozzle to printing temp
  M190 S{target_bed}                                            # Sets the target temp for the bed and waits

  # Gets ready to print by doing a purge line and updating the SB-leds
  # SET_DISPLAY_TEXT MSG="Printer goes brr"          # Displays info
  STATUS_PRINTING                                  # Sets SB-leds to printing-mode
  CLEAN_NOZZLE
  #
  G0 X{x_wait - 50} Y4 F10000                      # Moves to starting point
  G0 Z0.4                                          # Raises Z to 0.4
  G91                                              # Incremental positioning 
  # G1 X100 E20 F1000                              # Purge line
  G90                                              # Absolute position
  #
  #     SFS encoder
  RESPOND MSG="Enable SFS filament Sensor -- macros.cfg"
  SFS_ENABLE  #  enable filament encoder sensors  added 12/6/2024 cpe (not tested)
  

#####################################################################
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
[gcode_macro PRINT_START_SuperSlicerVersion]
gcode:
    STATUS_HOMING
    ;{% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    ;{% endif %}
    HEATSOAK       #  Just insures the bed at 105 and extruder at 150, but does not wait for heating
	# set_Chamber_Printing_LEDs
    ;{% if printer.quad_gantry_level.applied == False %}
    ;    {% if "xyz" not in printer.toolhead.homed_axes %}
    ;        G28 ; home if not already homed
    ;    {% endif %}
    G32    ;  do everthing
    ;{% endif %}
;    VORON_PURGE
    G90                            ; absolute positioning
    G1 Z20 F3000                   ; move nozzle away from bed
    STATUS_READY
#
#     SFS encoder
    SFS_ENABLE  #  enable filament encoder sensors  added 12/6/2024 cpe (not tested)
#

#####################################################################
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    CLEAN_NOZZLE
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 Z{z_safe} F3600
    ;G0 X{x_safe} Y{y_safe} F3600  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    ;  disable SFS sensor and turn off stepper drive
    # Disable steppers
    M84
    SFS_DISABLE
    ;BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
	#ChamberTwinkleLED COUNT=40

#####################################################################
[gcode_macro UNLOAD_FILAMENT]
description: Helper: Positon Extruder, set temperature to unload. Usage: _UNLOAD_FILAMENT [TEMP=etemp(135)]
gcode:
  {% set etemp = params.EXTRUDER|default(240)|int %}    ###  changed ETEMP to EXTRUDER   12/17/2023
    {% if "xyz" not in printer.toolhead.homed_axes %}
       G28
    {% endif %}
    ;{% set temp = params.TEMP|default(100)|int %}
	
    G0 X275 Y50 Z50 F3600     #  position  extruder for heat soak
	
	M104 S{etemp}                                            # Heat the nozzle

#####################################################################
[gcode_macro HEATSOAK]
description: Helper: Set up to heat soak printer. Usage: _HEATSOAK [TEMP=temp(105)]
gcode:
  {% set hsBedTemp = params.BED|default(100)|int %}      #   was TEMP changed 10/8/2023 for compatibility with Orca should also work on SS
 ; {% set move = params.MOVE|default(1)|int %}
      #  is this the proper place to set the timelapse stuff?
    _SET_TIMELAPSE_SETUP park_enable=True park_pos=back_right TRAVEL_SPEED=150
	# set_Chamber_Heating_LEDs	
	STATUS_HEATING
	;_PRINT_AR T="Warming up"
    G0 X150 Y150 Z100 F3600     #  position  extruder for heat soak
;	M141 S0                                                 # Turn off exhaust fan
	M104 S150                                            # Set hotend to no-ooze temp
	M106 S205                                            # Turn on part fan to 80% for 
	{% if hsBedTemp >= 100 %}                                 # It's ABS or other high-temp plastic, closed case
	    M140 S100                                            # Heat the bed to 100 for 
		SET_FAN_SPEED FAN=nevermore SPEED=0.7 # Turn on Nevermore fans to circulate & accelerate chamber soak
;        TEMPERATURE_WAIT SENSOR = "temperature_sensor chamber" [MINIMUM=30] [MAXIMUM=60]
    {% else %}
		M106 S0       # Turn off part fan. Open case, no need
		SET_FAN_SPEED FAN=nevermore SPEED=0                   # Make sure Nevermore is off
        m140 s{hsBedTemp}                          #  just use the bed temp if less than 100
	{% endif %}
	
;	{% if move == 1 %}
;		_CG28                                                 # Conditional home
;		PARK P=bed                                            # Park toolhead in safe location (center volume)
;		LED_HEATING
;	{% endif %}


#####################################################################
[gcode_macro CANCEL_HEATSOAK]
description: cancels an in-progress HEATSOAK cycle
gcode:
    M106 S0
    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=nevermore SPEED=0


################################################################################
[gcode_macro _CLEAN_NOZZLE_old]
variable_start_x: 280
variable_start_y: 315
variable_start_z: 6
variable_wipe_dist: -50
variable_wipe_qty: 5
variable_wipe_spd: 200
variable_raise_distance: 30

gcode:
 
  SAVE_GCODE_STATE NAME=clean_nozzle_state

 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
 {% endif %}
 
 G90                                            ; absolute positioning
 ## Move nozzle to start position
 G1 X{start_x} Y{start_y} F6000
 G1 Z{start_z} F1500

 ## Wipe nozzle
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x + wipe_dist} F{wipe_spd * 60}
   G1 X{start_x} F{wipe_spd * 60}
 {% endfor %}
#  yNozzle Wiper Silicone Brushe_shift  ??
 ## Raise nozzle
 G1 Z{raise_distance}
  RESTORE_GCODE_STATE NAME=clean_nozzle_state MOVE=1 MOVE_SPEED=6000

################################################################################
[gcode_macro CLEAN_NOZZLE]
#  working as of 7/5/2025 using gantry mounted cleaner  cpe
variable_start_x: 215
variable_wipe_spd: 100  # 200
variable_ywipe_shift: -2  # moves to differnt spot on wiper
variable_start_y: 315
variable_wipe_dist: -40
gcode:
   SAVE_GCODE_STATE NAME=clean_nozzle_gantry_state
   # needs a slight upward motion in z here to insure clearance
   G91
   G0 Z4
   G90
   G0 X{start_x} Y{start_y} F6000
   G0 X{start_x + wipe_dist} F{wipe_spd * 60}
   G91
   G0 Y{ywipe_shift}
   #  return on a slightly different path
   G90
   G0 X{start_x} F{wipe_spd * 60}
   RESTORE_GCODE_STATE NAME=clean_nozzle_gantry_state MOVE=1 MOVE_SPEED=6000
   
