################
#   BTT Smart Filament Sensor v2.0
#     installed 12/6/2024   cpe
################
#
#   missing filament sensor switch
[filament_switch_sensor switch_sensor]
switch_pin: PG12
pause_on_runout: False
runout_gcode:
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0 ; Put your filament sensor's name after SENSOR=
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
  RESPOND MSG="Filament Switch runout --> PRINT PAUSED"
insert_gcode:
  M117 Filament switch inserted
  RESPOND MSC="Filament switch inserted"

#    No filament motion sensor
[filament_motion_sensor encoder_sensor]
switch_pin: ^PG13
#detection_length: 2.88
detection_length: 3.0    #  12/6/2024   cpe   There is a lot of  filament left in the tube
extruder: extruder
pause_on_runout: False
runout_gcode:
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0 ; Put your filament sensor's name after SENSOR=
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament encoder runout
  RESPOND MSG="Filament encoder runout --> PRINT PAUSED"
insert_gcode:
  M117 Filament encoder inserted
  RESPOND MSG="Filament encoder inserted"

####################
#    enable, disable the SFS encoder    added 12/7/2024  cpe
####################
[gcode_macro SFS_ENABLE]
description: Enable smart filament sensor
gcode:
  M117 ENABLING the Smart Filament Sensor
  RESPOND MSG="Smart Filament Sensor is --> ENABLED!"
  #action_respond_info("Enabling Smart Filament Sensor")
#  G92 E0
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1 ; Put your filament sensor's name after SENSOR=
[gcode_macro SFS_DISABLE]
description: Disable smart filament sensor
gcode:
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0 ; Put your filament sensor's name after SENSOR=
  M117 DISABLING the Smart Filament Sensor
  RESPOND MSG="Smart Filament Sensor is --> DISABLED"
#  G92 E0
[delayed_gcode DISABLEFILAMENTSENSOR] ; This will disable the SFS 1 second after klipper starts
initial_duration: 1
gcode:
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0 ; Put your filament sensor's name after SENSOR=
  M117 DISABLING the Smart Filament Sensor
  RESPOND MSG="Smart Filament Sensor is --> DISABLED 1 second delay"
